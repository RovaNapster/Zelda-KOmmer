<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <title>CREED STIL-Bridge</title>
    <style>
        /* 1. CSS VARIABLES: AMOLED & Deep Blue */
        :root {
            --amoled-black: #000000;
            --card-bg: #030b17; /* Very deep blue-black */
            --accent-blue: #0A84FF;
            --glow-cyan: #00E5FF;
            --text-main: #FFFFFF;
            --text-muted: #6b829e;
        }

        /* 2. BASE RESET & FONT OPTIMIZATION */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--amoled-black);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding: 24px;
        }

        /* 3. HARDWARE ACCELERATION (120-165Hz Optimization) */
        .hardware-accelerated {
            will-change: transform, opacity;
            transform: translateZ(0); /* Tvingar GPU-rendering */
        }

        /* 4. LAYOUT & CARDS */
        header { margin-bottom: 40px; text-align: center; }
        h1 { font-weight: 800; font-size: 1.5rem; letter-spacing: 2px; color: var(--text-main); }
        .system-status { font-family: monospace; font-size: 0.75rem; color: var(--glow-cyan); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

        .dashboard-grid { display: grid; gap: 16px; }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(10, 132, 255, 0.15);
        }

        /* AMOLED Glow Effect (Optimized: Uses opacity on pseudo-element instead of box-shadow to prevent repaint stutter) */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--glow-cyan), transparent);
            opacity: 0.5;
            transition: opacity 0.3s ease;
        }

        /* 5. TYPOGRAPHY FOR NUMBERS (Tabular nums stops jumping during animation) */
        .card-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .card-value { 
            font-size: 2rem; 
            font-weight: 700; 
            color: var(--text-main); 
            font-variant-numeric: tabular-nums; 
        }
        
        /* Hero Card (Total Wealth) */
        .hero-card { border-color: rgba(0, 229, 255, 0.3); padding: 32px 24px; text-align: center; }
        .hero-card .card-value { font-size: 2.8rem; text-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }

        .sub-data { font-size: 0.8rem; color: var(--accent-blue); margin-top: 8px; font-family: monospace; }

        /* Animation class for load */
        .fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Delay stagger */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

    </style>
</head>
<body>

    <header class="hardware-accelerated fade-in-up">
        <h1>CREED WEALTH</h1>
        <div class="system-status" id="status-indicator">● SYNCING DATA</div>
    </header>

    <div class="dashboard-grid">
        <div class="card hero-card hardware-accelerated fade-in-up delay-1">
            <div class="card-label">Total Verified Net Worth</div>
            <div class="card-value" id="val-total">0</div>
            <div class="sub-data" id="time-stamp">Last sync: --:--:--</div>
        </div>

        <div class="card hardware-accelerated fade-in-up delay-2">
            <div class="card-label">Liquid Cash (Creedy)</div>
            <div class="card-value" id="val-liquid">0</div>
            <div class="sub-data">Mathematical Integrity: 100%</div>
        </div>

        <div class="card hardware-accelerated fade-in-up delay-3">
            <div class="card-label">Secured Gold Reserve</div>
            <div class="card-value" id="val-gold">0</div>
            <div class="sub-data" id="gold-spot">Spot: --- SEK/g</div>
        </div>
    </div>

    <script>
        // --- 165Hz OPTIMIZED NUMBER COUNTER ---
        // Använder requestAnimationFrame för att matcha skärmens refresh rate perfekt.
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                
                // Easing function (Cubic Out) för en premium "inbromsning" av siffrorna
                const easeOutCubic = 1 - Math.pow(1 - progress, 3);
                const currentVal = (progress * (end - start) + start);
                
                obj.innerHTML = new Intl.NumberFormat('sv-SE').format(currentVal.toFixed(0));
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    // Sätt exakt värde med decimaler när animationen är klar
                    obj.innerHTML = new Intl.NumberFormat('sv-SE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(end);
                }
            };
            window.requestAnimationFrame(step);
        }

        // --- FETCH DATA FROM PYTHON BACKEND ---
        async function loadCreedData() {
            try {
                // I produktion hämtar denna JSON-filen som GitHub Actions genererar
                const response = await fetch('creed_data.json');
                const data = await response.json();

                if (data.status === "MATHEMATICALLY VERIFIED") {
                    document.getElementById('status-indicator').innerText = "● MATHEMATICALLY VERIFIED";
                    document.getElementById('time-stamp').innerText = `Sync: ${data.timestamp}`;
                    document.getElementById('gold-spot').innerText = `Live Spot: ${data.gold_price_used.toFixed(2)} SEK/g`;

                    // Trigga 165Hz animationerna
                    animateValue(document.getElementById('val-total'), 0, data.total_wealth_sek, 1500);
                    animateValue(document.getElementById('val-liquid'), 0, data.liquid_sek, 1200);
                    animateValue(document.getElementById('val-gold'), 0, data.gold_sek, 1400);
                } else {
                    throw new Error("Validation Error from Backend");
                }

            } catch (error) {
                document.getElementById('status-indicator').innerText = "● SYSTEM ERROR / OFFLINE";
                document.getElementById('status-indicator').style.color = "#FF3B30"; // Red error
                console.error("CREED Bridge Error:", error);
            }
        }

        // Initiera när DOM är redo
        document.addEventListener('DOMContentLoaded', loadCreedData);
    </script>
</body>
</html>
